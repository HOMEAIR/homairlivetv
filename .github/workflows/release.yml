name: Android Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/homeair-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/homeair-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          HOME_AIR_PROXY_URL: https://livo.hmairtv.workers.dev/
          HOME_AIR_APP_SECRET: ${{ secrets.HOME_AIR_APP_SECRET }}
        run: gradle assembleRelease

      - name: Checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME"             app/build/outputs/apk/release/app-release.apk             app/build/outputs/apk/release/SHA256SUMS.txt             --generate-notes
